        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================

    <header>

        <nav>

            <ul>

                <li>

            </ul>

        </nav>

    </header>



    <!-- ==========================================
         CONTENU PRINCIPAL
         ========================================== -->

    <main>


        <section class="connexion">


            <div class="boite-connexion">


                <h1>
                    Connexion
                </h1>


                <p>
                    Connectez-vous à votre compte BJE.
                </p>


                <form>


                    <!-- EMAIL -->

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Votre adresse email"
                    >


                    <!-- MOT DE PASSE -->

                    <label for="motdepasse">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="motdepasse"
                        name="motdepasse"
                        placeholder="Votre mot de passe"
                    >


                    <!-- MOT DE PASSE OUBLIÉ -->

                    <a
                        href="#"
                        class="mot-de-passe-oublie"
                    >
                        Mot de passe oublié ?
                    </a>


                    <!-- BOUTON -->

                    <button type="submit">
                        Se connecter
                    </button>


                </form>


                <!-- INSCRIPTION -->

                <div class="inscription">

                    <p>
                        Vous n'avez pas encore de compte ?
                    </p>

                    <a href="#">
                        Créer un compte
                    </a>

                </div>


            </div>


        </section>


    </main>



    <!-- ==========================================
         PIED DE PAGE
         ========================================== -->

    <footer>

        <p>
            © 2026 BJE - Boutique Jeune Entrepreneur
        </p>

        <p>
            Style, qualité et confiance.
        </p>

    </footer>
